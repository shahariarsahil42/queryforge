services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRES_URL: postgresql://queryforge:queryforge@postgres:5432/queryforge
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: queryforge
      POSTGRES_PASSWORD: queryforge
      POSTGRES_DB: queryforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queryforge -d queryforge"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data
  mongo:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - mongo_data:/data/db
volumes:
  postgres_data:
  mongo_data:
